[project]
name = "dc-harness"
version = "0.1.0"
description = "Research harness for DC Inside gallery opinion analysis"
requires-python = ">=3.11"
dependencies = ["openai>=1.40", "httpx>=0.27", "beautifulsoup4>=4.12"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
krw-ontology-dc = "dc_harness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dc_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# 로컬 연구 도구 표준 룰셋. E501 제외: execute() 호출점 인라인 SQL 리터럴(보안 스캐너 요구).
# DTZ(naive datetime)은 의도적 — DC 게시물은 로컬(KST) 시각 저장.
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E501"]
